[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  knolleary/PubSubClient@2.8
  bblanchon/ArduinoJson@6.21.5
  blynkkk/Blynk@1.3.2
build_flags = -Wall -Wextra

[env:esp32-real]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -D SMARTBIN_REAL=1

[env:esp32-wokwi-local]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -D SMARTBIN_WOKWI_LOCAL=1
